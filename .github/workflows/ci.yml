name: CI - Build and Push

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: ./gradlew bootJar -x test

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/my-blog-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/my-blog-app:${{ github.sha }}

    - name: Update image tag in infra repo
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        IMAGE_TAG: ${{ github.sha }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        git clone https://x-access-token:${GH_TOKEN}@github.com/wjdeksdn-source/my-blog-infra.git
        cd my-blog-infra
        sed -i "s|tag:.*|tag: \"${IMAGE_TAG}\"|" helm/my-blog/values.yaml
        sed -i "s|repository:.*|repository: ${DOCKERHUB_USERNAME}/my-blog-app|" helm/my-blog/values.yaml
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add helm/my-blog/values.yaml
        git commit -m "chore: update image tag to ${IMAGE_TAG}"
        git push
